<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Card</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-500 to-indigo-600 p-6">

    <!-- Profile Card -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- Profile Image -->
        <div class="flex flex-col items-center p-8">

            <img 
                src="c:\Users\ACER\Downloads\profile.png.jpg"
                alt="Profile Image"
                class="w-32 h-32 rounded-full object-cover border-4 border-purple-500 shadow-lg"
            >

            <!-- Profile Info -->
            <div class="text-center mt-5">
                <h1 class="text-3xl font-bold text-gray-800">
                    Jomar T. Ceballos
                </h1>

                <p class="text-purple-600 font-medium mt-1">
                    Web Developer
                </p>
            </div>

        </div>

        <!-- Numbers -->
        <div class="grid grid-cols-3 border-t border-gray-200">

            <div class="text-center py-5">
                <h2 class="text-2xl font-bold text-gray-800">150</h2>
                <p class="text-gray-500 text-sm">Posts</p>
            </div>

            <div class="text-center py-5 border-l border-r border-gray-200">
                <h2 class="text-2xl font-bold text-gray-800">250k</h2>
                <p class="text-gray-500 text-sm">Followers</p>
            </div>

            <div class="text-center py-5">
                <h2 class="text-2xl font-bold text-gray-800">50</h2>
                <p class="text-gray-500 text-sm">Following</p>
            </div>

        </div>

        <!-- Buttons -->
        <div class="flex gap-4 p-6">

            <button
                class="flex-1 bg-purple-600 text-white py-3 rounded-xl font-semibold
                       hover:bg-purple-700 transition duration-300 shadow-md">
                Follow
            </button>

            <button
                class="flex-1 border-2 border-purple-600 text-purple-600 py-3 rounded-xl
                       font-semibold hover:bg-purple-600 hover:text-white
                       transition duration-300">
                Message
            </button>

        </div>

    </div>

</body>
</html>
